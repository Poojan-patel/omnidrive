<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}omnidrive{% endblock %}</title>
  <!-- HTMX from CDN for now; we'll vendor it locally as a polish item later. -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    /* ---------- reset + tokens ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body, h1, h2, h3, p, ul, figure { margin: 0; padding: 0; }
    ul { list-style: none; }
    button {
      font: inherit;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    :root {
      --color-bg:            #ffffff;
      --color-bg-sidebar:    #f8f9fa;
      --color-bg-hover:      #f1f3f4;
      --color-bg-subtle:     #fafbfc;
      --color-border:        #e5e7eb;
      --color-border-strong: #d1d5db;
      --color-text:          #1f2937;
      --color-text-secondary:#4b5563;
      --color-text-muted:    #9ca3af;
      --color-accent:        #1a73e8;
      --color-accent-hover:  #1558b8;
      --color-accent-soft:   #e8f0fe;
      --color-danger:        #dc2626;
      --color-danger-soft:   #fef2f2;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 2px 6px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);

      --radius-sm:   4px;
      --radius-md:   8px;
      --radius-lg:   12px;
      --radius-pill: 999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;

      --sidebar-width: 264px;
      --header-height: 56px;
    }

    body {
      font-family: var(--font-sans);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.5;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- app shell ---------- */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      grid-template-rows: var(--header-height) 1fr;
      grid-template-areas:
        "header header"
        "sidebar main";
      height: 100vh;
    }

    .header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 0 var(--space-5);
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .logo svg { width: 28px; height: 28px; flex-shrink: 0; }
    .logo .brand {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--color-text);
    }

    /* ---------- sidebar ---------- */
    .sidebar {
      grid-area: sidebar;
      background: var(--color-bg-sidebar);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-section-label {
      padding: var(--space-5) var(--space-5) var(--space-2);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .sidebar-accounts {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-1) var(--space-2);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-empty-msg {
      padding: var(--space-5) var(--space-3);
      text-align: center;
      color: var(--color-text-muted);
      font-size: 13px;
    }
    .sidebar-account {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: background 0.12s ease;
      position: relative;
    }
    .sidebar-account:hover {
      background: var(--color-bg-hover);
    }
    .sidebar-account-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-account-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-account-email {
      font-size: 12px;
      color: var(--color-text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-account-email-only {
      font-size: 13px;
      color: var(--color-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-remove {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--color-text-muted);
      opacity: 0;
      transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
      flex-shrink: 0;
    }
    .sidebar-account:hover .account-remove,
    .account-remove:focus-visible {
      opacity: 1;
    }
    .account-remove:hover {
      background: var(--color-danger-soft);
      color: var(--color-danger);
    }
    .account-remove:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
    }
    .account-remove svg { width: 14px; height: 14px; }

    .sidebar-footer {
      padding: var(--space-3);
      border-top: 1px solid var(--color-border);
      background: var(--color-bg-sidebar);
    }

    /* ---------- avatars ---------- */
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--color-bg-hover);
      flex-shrink: 0;
    }
    .avatar-sm { width: 28px; height: 28px; }
    .avatar-lg { width: 40px; height: 40px; }
    .avatar-placeholder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent);
      color: white;
      font-weight: 600;
      font-size: 13px;
    }
    .avatar-lg.avatar-placeholder { font-size: 16px; }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      min-height: 36px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
      cursor: pointer;
      user-select: none;
    }
    .btn-primary {
      background: var(--color-accent);
      color: white;
      width: 100%;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }
    .btn svg { width: 16px; height: 16px; }

    /* ---------- main pane ---------- */
    .main {
      grid-area: main;
      overflow-y: auto;
      padding: var(--space-5) var(--space-6) var(--space-7);
    }
    .main-inner {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ---------- search bar ---------- */
    .searchbar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-4);
      background: var(--color-bg-sidebar);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      transition: background 0.12s ease, border-color 0.12s ease,
                  box-shadow 0.12s ease;
      margin-bottom: var(--space-6);
    }
    .searchbar:hover {
      background: var(--color-bg);
      border-color: var(--color-border);
    }
    .searchbar:focus-within {
      background: var(--color-bg);
      border-color: var(--color-border-strong);
      box-shadow: var(--shadow-md);
    }
    .searchbar svg {
      width: 20px;
      height: 20px;
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .searchbar input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font: inherit;
      color: var(--color-text);
      font-size: 15px;
      padding: var(--space-2) 0;
    }
    .searchbar input::placeholder { color: var(--color-text-muted); }

    /* ---------- main content ---------- */
    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
      letter-spacing: 0.02em;
    }

    .empty-state {
      padding: var(--space-7) var(--space-5);
      text-align: center;
      color: var(--color-text-secondary);
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-lg);
      background: var(--color-bg-subtle);
    }
    .empty-state .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto var(--space-4);
      color: var(--color-text-muted);
    }
    .empty-state .empty-icon svg { width: 100%; height: 100%; }
    .empty-state .empty-headline {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .empty-state .empty-detail {
      font-size: 14px;
      max-width: 380px;
      margin: 0 auto;
      line-height: 1.55;
    }

    /* ---------- banner ---------- */
    .banner {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      font-size: 13px;
      line-height: 1.5;
    }
    .banner-warning {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #92400e;
    }
    .banner strong { font-weight: 600; }

    /* ---------- file list table ---------- */
    .file-list {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .file-list thead th {
      text-align: left;
      font-weight: 500;
      color: var(--color-text-muted);
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--color-border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .file-list tbody tr {
      border-bottom: 1px solid var(--color-border);
      transition: background 0.1s ease;
    }
    .file-list tbody tr:hover {
      background: var(--color-bg-hover);
    }
    .file-list td {
      padding: var(--space-3);
      vertical-align: middle;
    }
    .col-type     { width: 110px; }
    .col-location { width: 30%; }
    .col-modified {
      width: 160px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .type-badge svg { width: 18px; height: 18px; flex-shrink: 0; }
    .type-badge.type-folder { color: #f9ab00; }
    .type-badge.type-folder svg { color: #f9ab00; }
    .type-badge.type-file svg { color: var(--color-text-muted); }

    .file-name-link {
      color: var(--color-text);
      font-weight: 500;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    a.file-name-link:hover {
      color: var(--color-accent);
      text-decoration: underline;
    }

    .location-chip {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 10px;
      background: var(--color-accent-soft);
      color: var(--color-accent-hover);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 500;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="logo" href="/" aria-label="omnidrive home">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="13" r="8" fill="#1a73e8" opacity="0.85"/>
          <circle cx="21" cy="13" r="8" fill="#34a853" opacity="0.75"/>
          <circle cx="16" cy="22" r="8" fill="#fbbc04" opacity="0.7"/>
        </svg>
        <span class="brand">omnidrive</span>
      </a>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
