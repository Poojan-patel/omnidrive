[package]
name = "omnidrive"
version = "0.1.0"
edition = "2021"
description = "Unified search across multiple Google Drive accounts"
license = "MIT"
authors = ["Poojan Patel <ppatel@rippling.com>"]

[dependencies]
# Web framework + async runtime
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Templates (HTMX is just a JS file we serve statically — no crate needed)
askama = "0.12"
askama_axum = "0.4"

# Database (bundled = SQLite compiled in, no system dependency)
rusqlite = { version = "0.31", features = ["bundled"] }

# OAuth 2.0 client (handles PKCE, token refresh, etc.)
oauth2 = "4"

# HTTP client (for calling Google APIs in M7)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Authenticated symmetric encryption for refresh tokens at rest in SQLite.
# AES-256-GCM with a 12-byte nonce per row; the master key lives in a
# sibling file (master.key, mode 0600).
aes-gcm = "0.10"

# CSPRNG for the master key + per-row nonces.
rand = "0.8"

# Base64 (de)coding — for the optional OMNIDRIVE_MASTER_KEY env override.
base64 = "0.22"

# Cross-platform config/data directories (XDG on Linux, Application Support on macOS, AppData on Windows)
directories = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling — anyhow for app errors; we'll add thiserror later if we need typed errors
anyhow = "1"

# .env loading
dotenvy = "0.15"

[profile.release]
# A bit of optimization for the binary we eventually ship via GitHub Releases
lto = "thin"
codegen-units = 1
strip = true
